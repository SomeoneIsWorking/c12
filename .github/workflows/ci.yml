name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native-boundary:
    name: Linux x86-64 authenticated native startup boundary
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.12'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked Python environment
        run: uv sync --frozen
      - name: Resolve the exact framework revision
        run: uv run --frozen python -m tools.ci_framework
      - name: Provision the canonical Linux dependencies
        uses: ./external/psxport/.github/actions/setup-linux
        with:
          framework-directory: external/psxport
      - name: Verify the asset-free native startup boundary
        run: uv run --frozen python -m tools.verify
